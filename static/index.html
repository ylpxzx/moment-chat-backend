<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅后即焚聊天 - 后端测试</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2.5rem;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1rem;
      }

      .logo {
        font-size: 4rem;
        margin-bottom: 20px;
        color: #667eea;
      }

      .status {
        background: #f0f9ff;
        border: 2px solid #bae6fd;
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
        text-align: left;
      }

      .endpoint {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 15px;
        margin: 10px 0;
        text-align: left;
        font-family: monospace;
      }

      .method {
        display: inline-block;
        padding: 4px 8px;
        background: #10b981;
        color: white;
        border-radius: 4px;
        font-size: 0.9rem;
        margin-right: 10px;
      }

      .endpoint-url {
        color: #3b82f6;
        word-break: break-all;
      }

      .btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        margin: 5px;
        text-decoration: none;
        display: inline-block;
      }

      .btn:hover {
        background: #5a67d8;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #48bb78;
      }

      .btn-secondary:hover {
        background: #38a169;
      }

      .result {
        margin-top: 20px;
        padding: 15px;
        background: #f7fafc;
        border-radius: 8px;
        text-align: left;
        font-family: monospace;
        font-size: 0.9rem;
        max-height: 200px;
        overflow-y: auto;
      }

      .footer {
        margin-top: 30px;
        color: #718096;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🔥</div>
      <h1>阅后即焚聊天</h1>
      <p class="subtitle">消息20秒后自动消失的隐私聊天应用</p>

      <div class="status">
        <h3>后端服务状态</h3>
        <p>当前后端服务运行正常，以下API端点可用：</p>
      </div>

      <div class="endpoint">
        <span class="method">GET</span>
        <span class="endpoint-url">/ping</span>
        <p>服务状态检查</p>
      </div>

      <div class="endpoint">
        <span class="method">GET</span>
        <span class="endpoint-url">/api/v1/health</span>
        <p>健康检查接口</p>
      </div>

      <div class="endpoint">
        <span class="method">POST</span>
        <span class="endpoint-url">/api/v1/rooms</span>
        <p>创建新聊天室</p>
      </div>

      <div class="endpoint">
        <span class="method">GET</span>
        <span class="endpoint-url">/api/v1/rooms/:id/check</span>
        <p>检查聊天室是否存在</p>
      </div>

      <div class="buttons">
        <button class="btn" onclick="testPing()">测试服务状态</button>
        <button class="btn btn-secondary" onclick="createRoom()">
          创建测试房间
        </button>
      </div>

      <div id="result" class="result"></div>

      <div class="footer">
        <p>后端服务运行中 | Gin + Go + Redis</p>
        <p>前端应用即将上线...</p>
      </div>
    </div>

    <script>
      const baseUrl = window.location.origin;
      const resultEl = document.getElementById("result");

      function testPing() {
        resultEl.innerHTML = "请求中...";
        fetch(baseUrl + "/ping")
          .then((res) => res.json())
          .then((data) => {
            resultEl.innerHTML = JSON.stringify(data, null, 2);
          })
          .catch((err) => {
            resultEl.innerHTML = "错误: " + err.message;
          });
      }

      function createRoom() {
        resultEl.innerHTML = "创建房间中...";
        fetch(baseUrl + "/api/v1/rooms", {
          method: "POST",
        })
          .then((res) => res.json())
          .then((data) => {
            resultEl.innerHTML =
              JSON.stringify(data, null, 2) +
              "\n\n你可以使用房间号访问：" +
              baseUrl +
              "/api/v1/rooms/" +
              data.roomId +
              "/check";
          })
          .catch((err) => {
            resultEl.innerHTML = "错误: " + err.message;
          });
      }

      // 页面加载时自动测试服务状态
      window.onload = testPing;
    </script>
  </body>
</html>
